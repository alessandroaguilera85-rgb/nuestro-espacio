<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
  <title>Nuestro Espacio</title>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            surface: '#fcf9f4',
            primary: '#944652',
            'primary-container': '#d67b88',
            'on-primary': '#ffffff',
            'on-surface': '#1c1c19',
            'on-surface-variant': '#534344',
            'surface-container-lowest': '#ffffff'
          },
          fontFamily: {
            display: ['Playfair Display', 'serif'],
            body: ['Plus Jakarta Sans', 'sans-serif']
          }
        }
      }
    };
  </script>
  <style>
    html, body { margin: 0; height: 100%; }
    body { overscroll-behavior: none; -webkit-tap-highlight-color: transparent; }
    .fade-in { animation: fadeIn 0.45s ease forwards; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }
  </style>
</head>
<body class="bg-surface min-h-screen flex flex-col items-center justify-center relative overflow-hidden font-body text-on-surface">
  <div class="pointer-events-none absolute inset-0">
    <div class="absolute top-16 left-10 w-2 h-2 rounded-full bg-primary-container/30"></div>
    <div class="absolute top-28 right-14 w-1.5 h-1.5 rounded-full bg-primary/20"></div>
    <div class="absolute bottom-32 left-16 w-2 h-2 rounded-full bg-primary-container/25"></div>
  </div>

  <!-- WELCOME -->
  <div id="screen-welcome" class="flex flex-col items-center text-center px-8 fade-in z-10">
    <div class="w-28 h-28 rounded-2xl overflow-hidden bg-[#f5ebe0] shadow-xl mb-10 flex items-center justify-center">
      <img src="https://images.unsplash.com/photo-1490750967868-88aa4486c946?w=300&h=300&fit=crop" alt="Rosa" class="w-full h-full object-cover"
        onerror="this.parentElement.innerHTML='🌸'"/>
    </div>
    <p class="text-[11px] tracking-[0.28em] uppercase text-primary font-semibold mb-2">Bienvenido a</p>
    <h1 class="font-display text-4xl italic font-semibold leading-tight mb-3">Nuestro Espacio</h1>
    <p class="text-on-surface-variant text-sm max-w-xs leading-relaxed mb-10">
      Un rinconcito hecho con mucho cariño, solo para los dos.
    </p>
    <button id="btn-entrar" type="button"
      class="inline-flex items-center gap-2 px-10 py-3.5 rounded-full bg-primary-container text-on-primary font-semibold shadow-lg active:scale-95 transition-transform">
      Entrar
      <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
    </button>
  </div>

  <!-- USER SELECT — estilo captura -->
  <div id="screen-user" class="hidden flex flex-col items-center text-center px-8 fade-in z-10 w-full max-w-sm">
    <p class="text-[12px] tracking-wide text-on-surface-variant/80 mb-1">antes de entrar</p>
    <h2 class="font-display text-3xl italic font-semibold mb-2 text-[#3d2a2e]">¿Quién eres?</h2>
    <p class="text-on-surface-variant text-sm mb-8 max-w-xs leading-relaxed">
      Elige tu nombre para guardar lo que compartas con tu autoría.
    </p>
    <div class="flex flex-col gap-3 w-full">
      <button type="button" data-user="Alessandro"
        class="user-pick w-full py-4 px-6 rounded-2xl bg-white shadow-md active:scale-[0.98] transition-all text-center">
        <span class="font-display text-xl text-[#3d2a2e]">Alessandro</span>
      </button>
      <button type="button" data-user="Mayerli"
        class="user-pick w-full py-4 px-6 rounded-2xl bg-white shadow-md active:scale-[0.98] transition-all text-center">
        <span class="font-display text-xl text-[#3d2a2e]">Mayerli</span>
      </button>
    </div>
  </div>

  <script>
    (function () {
      if (localStorage.getItem('keepsake_user')) {
        location.replace('pages/inicio.html');
        return;
      }
      const welcome = document.getElementById('screen-welcome');
      const userScreen = document.getElementById('screen-user');
      document.getElementById('btn-entrar').addEventListener('click', function () {
        welcome.classList.add('hidden');
        userScreen.classList.remove('hidden');
      });
      document.querySelectorAll('.user-pick').forEach(function (btn) {
        btn.addEventListener('click', function () {
          localStorage.setItem('keepsake_user', btn.getAttribute('data-user'));
          location.replace('pages/inicio.html');
        });
      });
    })();
  </script>
</body>
</html>
