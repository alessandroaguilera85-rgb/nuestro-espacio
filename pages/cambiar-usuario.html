<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"/>
<title>Cambiar usuario</title>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<style>
html,body{margin:0;height:100%}body{overscroll-behavior:none;background:#f8efe9;-webkit-tap-highlight-color:transparent}
</style>
</head>
<body class="min-h-screen flex flex-col items-center justify-center px-8 font-[Plus_Jakarta_Sans]">
  <div class="w-full max-w-sm text-center">
    <p class="text-[12px] tracking-wide text-[#6b5558]/80 mb-1">cambiar de cuenta</p>
    <h1 class="font-[Playfair_Display] text-3xl italic font-semibold text-[#3d2a2e] mb-2">¿Quién eres?</h1>
    <p class="text-sm text-[#6b5558] mb-8 leading-relaxed">
      Elige tu nombre para guardar lo que compartas con tu autoría.
    </p>
    <div class="flex flex-col gap-3">
      <button type="button" data-user="Alessandro"
        class="user-pick w-full py-4 px-6 rounded-2xl bg-white shadow-md active:scale-[0.98] transition-all">
        <span class="font-[Playfair_Display] text-xl text-[#3d2a2e]">Alessandro</span>
      </button>
      <button type="button" data-user="Mayerli"
        class="user-pick w-full py-4 px-6 rounded-2xl bg-white shadow-md active:scale-[0.98] transition-all">
        <span class="font-[Playfair_Display] text-xl text-[#3d2a2e]">Mayerli</span>
      </button>
    </div>
    <a href="inicio.html" class="inline-block mt-8 text-sm text-[#944652]">← Volver al espacio</a>
  </div>
  <script>
    document.querySelectorAll('.user-pick').forEach(function(btn){
      btn.addEventListener('click', function(){
        localStorage.setItem('keepsake_user', btn.getAttribute('data-user'));
        location.replace('inicio.html');
      });
    });
  </script>
</body>
</html>
