<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Mensajes</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{colors:{primary:"#944652","primary-container":"#d67b88","on-primary":"#ffffff",surface:"#fcf9f4","on-surface":"#1c1c19","on-surface-variant":"#534344"},fontFamily:{display:["Playfair Display"],body:["Plus Jakarta Sans"]}}}};
</script>
<style>
html,body{margin:0;height:100%;overflow:hidden;max-width:100vw}
body{background:#fcf9f4;-webkit-tap-highlight-color:transparent}
.pb-safe{padding-bottom:env(safe-area-inset-bottom,0)}
.bubble-me{background:#d67b88;color:#fff;border-radius:18px 18px 4px 18px}
.bubble-you{background:#fff;color:#1c1c19;border-radius:18px 18px 18px 4px;box-shadow:0 1px 3px rgba(0,0,0,.06)}
.msg-row.sel .bubble-me,.msg-row.sel .bubble-you{outline:2px solid #944652}
.pulse{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{opacity:.45}}
audio{width:100%;min-width:220px;height:40px}
#thread{background-size:cover;background-position:center}
.sticker{font-size:42px;line-height:1}
</style>
</head>
<body class="font-body text-on-surface flex flex-col h-screen max-w-lg mx-auto w-full relative">
<header class="shrink-0 px-3 pt-3 pb-2 flex items-center gap-2 bg-surface/95 backdrop-blur z-10">
  <a href="inicio.html" class="w-9 h-9 rounded-full bg-white shadow-sm flex items-center justify-center shrink-0">
    <span class="material-symbols-outlined text-primary">arrow_back</span>
  </a>
  <button type="button" id="btn-title" class="flex-1 min-w-0 text-left">
    <p class="text-[10px] tracking-widest uppercase text-primary font-semibold">Chat</p>
    <h1 id="chat-title" class="font-display text-xl italic leading-tight truncate">Mensajes</h1>
  </button>
  <button id="btn-select" type="button" class="w-9 h-9 rounded-full bg-white shadow-sm flex items-center justify-center" title="Seleccionar">
    <span class="material-symbols-outlined text-[20px]">checklist</span>
  </button>
  <a href="llamada.html?tipo=audio" class="w-9 h-9 rounded-full bg-white shadow-sm flex items-center justify-center" title="Llamada">
    <span class="material-symbols-outlined text-[20px]">call</span>
  </a>
  <a href="llamada.html?tipo=video" class="w-9 h-9 rounded-full bg-white shadow-sm flex items-center justify-center" title="Videollamada">
    <span class="material-symbols-outlined text-[20px]">videocam</span>
  </a>
  <button id="btn-wall" type="button" class="w-9 h-9 rounded-full bg-white shadow-sm flex items-center justify-center" title="Fondo">
    <span class="material-symbols-outlined text-[20px]">wallpaper</span>
  </button>
</header>

<div id="call-in" class="hidden shrink-0 px-3 py-2 bg-[#1c1416] text-white flex items-center justify-between">
  <span id="call-in-txt" class="text-sm">Llamada entrante</span>
  <a href="llamada.html?tipo=video&modo=contestar" class="px-3 py-1 rounded-full bg-[#22c55e] text-xs font-semibold">Contestar</a>
</div>
<div id="sel-bar" class="hidden shrink-0 px-3 py-2 bg-[#944652] text-white flex items-center justify-between">
  <span id="sel-count" class="text-sm">0 seleccionados</span>
  <button id="btn-del-sel" type="button" class="inline-flex items-center gap-1 text-sm font-semibold">
    <span class="material-symbols-outlined text-[20px]">delete</span> Borrar
  </button>
</div>

<div id="thread" class="flex-1 overflow-y-auto px-3 py-3 space-y-2.5"></div>

<!-- Stickers -->
<div id="stickers" class="hidden shrink-0 px-3 py-2 bg-white border-t border-[#f0ede9] grid grid-cols-8 gap-1 text-2xl max-h-36 overflow-y-auto"></div>

<!-- Wallpaper picker -->
<div id="walls" class="hidden shrink-0 px-3 py-2 bg-white border-t border-[#f0ede9]">
  <p class="text-[10px] uppercase tracking-widest text-primary mb-2">Fondo compartido</p>
  <div class="flex gap-2 overflow-x-auto pb-1 items-center" id="wall-list"></div>
  <label class="mt-2 inline-flex items-center gap-1 text-xs text-primary cursor-pointer">
    <span class="material-symbols-outlined text-[18px]">photo_library</span> Usar foto de la galería
    <input id="wall-file" type="file" accept="image/*" class="hidden"/>
  </label>
</div>

<!-- Recording bar -->
<div id="rec-bar" class="hidden shrink-0 px-3 py-3 bg-white border-t border-[#f0ede9] flex items-center gap-2">
  <button id="rec-del" type="button" class="w-10 h-10 rounded-full bg-red-50 text-red-600 flex items-center justify-center">
    <span class="material-symbols-outlined">delete</span>
  </button>
  <button id="rec-pause" type="button" class="w-10 h-10 rounded-full bg-[#f0ede9] flex items-center justify-center">
    <span class="material-symbols-outlined" id="rec-pause-icon">pause</span>
  </button>
  <div class="flex-1 flex items-center gap-2">
    <span class="w-2.5 h-2.5 rounded-full bg-red-500 pulse" id="rec-dot"></span>
    <span id="rec-time" class="text-sm font-medium tabular-nums">0:00</span>
  </div>
  <button id="rec-send" type="button" class="w-11 h-11 rounded-full bg-primary-container text-white flex items-center justify-center">
    <span class="material-symbols-outlined">send</span>
  </button>
</div>

<div id="composer" class="shrink-0 px-3 pt-2 pb-safe bg-surface border-t border-[#f0ede9]">
  <div class="flex items-end gap-2 mb-1">
    <button id="btn-sticker" type="button" class="w-10 h-10 rounded-full bg-white shadow flex items-center justify-center text-primary shrink-0">
      <span class="material-symbols-outlined">mood</span>
    </button>
    <button id="btn-rec" type="button" class="w-10 h-10 rounded-full bg-white shadow flex items-center justify-center text-primary shrink-0">
      <span class="material-symbols-outlined">mic</span>
    </button>
    <textarea id="msg" rows="1" class="flex-1 max-h-24 px-4 py-2.5 rounded-2xl bg-white shadow-sm outline-none text-sm resize-none" placeholder="Escribe un mensaje..."></textarea>
    <button id="btn-send" type="button" class="w-11 h-11 rounded-full bg-primary-container text-white shadow flex items-center justify-center shrink-0">
      <span class="material-symbols-outlined">send</span>
    </button>
  </div>
</div>

<script src="../js/supabase-client.js"></script>
<script>
(function(){
  if(!localStorage.getItem('keepsake_user')){ location.replace('../index.html'); return; }
  const me = localStorage.getItem('keepsake_user');
  const otherDefault = (me||'').toLowerCase()==='alessandro' ? 'Mayerli' : 'Alessandro';
  const TITLE_KEY = 'keepsake_chat_title_' + (me||'').toLowerCase();
  const thread = document.getElementById('thread');
  const input = document.getElementById('msg');
  function currentTitle(){ return localStorage.getItem(TITLE_KEY) || otherDefault; }
  function setTitleUI(){ document.getElementById('chat-title').textContent = currentTitle(); }
  setTitleUI();
  const STICKERS = '❤️💕💗🥰😍😘💋🌹✨🌙⭐🦋🐱🐶🌸🌺🌻🌷🌈☀️🫶🥺😭😂🔥💯👑💌🎀'.split(/(.{1,2})/u).filter(s=>s && !s.match(/^\s*$/));
  // simpler sticker list
  const EMOJIS = ['❤️','💕','💗','🥰','😍','😘','💋','🌹','✨','🌙','⭐','🦋','🐱','🌸','🌺','🌻','🌷','🌈','☀️','🫶','🥺','😂','🔥','💌','🎀','🍫','🍓','🎵','💍','🏠'];
  const WALLS = [
    {id:'cream', css:'#fcf9f4'},
    {id:'rose', css:'#f7e4e6'},
    {id:'blush', css:'linear-gradient(180deg,#ffd9dd,#fcf9f4)'},
    {id:'sage', css:'linear-gradient(180deg,#e4efe6,#fcf9f4)'},
    {id:'night', css:'linear-gradient(180deg,#2c2424,#1c1c19)'},
    {id:'peach', css:'#fde8d8'}
  ];

  let items=[], selected=new Set(), selectMode=false;
  let mediaRec=null, chunks=[], recording=false, paused=false, recTimer=null, recSec=0, recStream=null;

  function esc(s){ if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;'); }
  function markChatRead(){ localStorage.setItem('keepsake_chat_read', new Date().toISOString()); }

  async function applyWall(css){
    let v = css || '#fcf9f4';
    if(window.KeepsakeDB && /\.e2ee/i.test(v)){
      v = await window.KeepsakeDB.resolveMedia(v);
    }
    if(/^https?:\/\//i.test(v) || v.startsWith('data:') || v.startsWith('blob:')){
      thread.style.backgroundImage = 'url("'+String(v).replace(/"/g,'')+'")';
      thread.style.backgroundColor = '#1c1c19';
      thread.style.backgroundSize = 'cover';
      thread.style.backgroundPosition = 'center';
    } else {
      thread.style.backgroundImage = 'none';
      thread.style.background = v;
    }
  }

  function render(){
    thread.innerHTML = items.map(it=>{
      const mine = (it.autor||'').toLowerCase()===me.toLowerCase();
      const audio = it.tipo==='audio' && it.url_archivo;
      const sticker = it.titulo==='sticker';
      const on = selected.has(it.id);
      return `<div class="msg-row flex items-center gap-2 ${mine?'justify-end':'justify-start'} ${on?'sel':''}" data-id="${it.id}">
        ${selectMode?`<button type="button" class="sel-box shrink-0 w-5 h-5 rounded-full border-2 ${on?'bg-primary border-primary':'border-[#c9c2bc]'} flex items-center justify-center">${on?'<span class="material-symbols-outlined text-white text-[14px]">check</span>':''}</button>`:''}
        <div class="max-w-[88%] ${mine?'bubble-me':'bubble-you'} px-3.5 py-2">
          ${audio?`<div class="w-[260px] max-w-full py-1"><audio controls playsinline preload="auto" src="${it.url_archivo}" class="w-full"></audio></div>`
            : sticker?`<p class="sticker">${esc(it.mensaje||'')}</p>`
            :`<p class="text-sm whitespace-pre-wrap break-words">${esc(it.mensaje||'')}</p>`}
          <p class="text-[10px] mt-1 ${mine?'text-white/70':'text-on-surface-variant'}">${esc(it.autor||'')} · ${window.KeepsakeDB.formatRelativeTime(it.created_at)}</p>
        </div>
      </div>`;
    }).join('') || '<p class="text-center text-sm text-on-surface-variant pt-16">Aún no hay mensajes. Empieza el hilo.</p>';
    if(!selectMode) thread.scrollTop = thread.scrollHeight;
    if(window.KeepsakeDB && window.KeepsakeDB.resolveMedia){
      thread.querySelectorAll('audio[src], img[src]').forEach(async (el)=>{
        const u = el.getAttribute('src');
        if(u && /\.e2ee/i.test(u)) el.src = await window.KeepsakeDB.resolveMedia(u);
      });
    }
    thread.querySelectorAll('.msg-row').forEach(el=>{
      el.addEventListener('click', (e)=>{
        if(!selectMode) return;
        e.preventDefault();
        toggleSel(el.dataset.id);
      });
      let hold;
      el.addEventListener('touchstart', ()=>{
        hold = setTimeout(()=>{
          if(!selectMode){
            selectMode=true;
            document.getElementById('sel-bar').classList.remove('hidden');
          }
          toggleSel(el.dataset.id);
        }, 450);
      }, {passive:true});
      el.addEventListener('touchend', ()=> clearTimeout(hold));
      el.addEventListener('touchmove', ()=> clearTimeout(hold));
      el.addEventListener('mousedown', ()=>{
        hold = setTimeout(()=>{
          if(!selectMode){
            selectMode=true;
            document.getElementById('sel-bar').classList.remove('hidden');
          }
          toggleSel(el.dataset.id);
        }, 450);
      });
      el.addEventListener('mouseup', ()=> clearTimeout(hold));
      el.addEventListener('mouseleave', ()=> clearTimeout(hold));
    });
  }

  function toggleSel(id){
    if(selected.has(id)) selected.delete(id); else selected.add(id);
    document.getElementById('sel-count').textContent = selected.size + ' seleccionados';
    render();
  }

  async function load(){
    const all = await window.KeepsakeDB.fetchContenidoAny(['textos']);
    const rows = all||[];
    const bg = rows.find(i => (i.comentario||'')==='chat_bg');
    if(bg && bg.mensaje) await applyWall(bg.mensaje);
    items = rows.filter(i => (i.comentario||'')==='chat').reverse();
    const stateRow = rows.find(r => (r.comentario||'')==='call_state');
    let st={}; try{ st=JSON.parse((stateRow&&stateRow.mensaje)||'{}'); }catch(e){}
    const incoming = rows.find(r=>{
      if((r.comentario||'')!=='webrtc' || r.titulo!=='offer') return false;
      const age = r.created_at ? (Date.now()-new Date(r.created_at).getTime()) : 999999;
      if(age > 120000) return false;
      try{ const m=JSON.parse(r.mensaje||'{}'); return m.from && m.from.toLowerCase()!==me.toLowerCase(); }catch(e){ return false; }
    });
    const stateFresh = stateRow && stateRow.created_at ? (Date.now()-new Date(stateRow.created_at).getTime())<120000 : false;
    const ringing = incoming && stateRow && stateFresh && st.state!=='ended' && (stateRow.titulo==='ringing' || st.state==='ringing' || stateRow.titulo==='live' || st.state==='live');
    const bar = document.getElementById('call-in');
    if(ringing && bar){
      bar.classList.remove('hidden');
      document.getElementById('call-in-txt').textContent = 'Te están llamando';
    } else if(bar) bar.classList.add('hidden');
    render();
    markChatRead();
  }

  async function notifyOther(text){
    try {
      await window.KeepsakeDB.createNotificacion({
        mensaje: me + ' te escribió: ' + (text || 'un mensaje'),
        titulo: 'Mensaje nuevo', seccion: 'textos', tipo: 'texto'
      });
    } catch(e){}
  }

  async function sendText(text, extra){
    extra = extra || {};
    if(!text) return;
    const {error} = await window.KeepsakeDB.insertContenido({
      seccion:'textos', tipo:'texto', titulo: extra.titulo||'chat', mensaje:text, comentario:'chat'
    });
    if(error){ alert(window.KeepsakeDB.errMsg(error)); return; }
    await notifyOther(text.length>40?text.slice(0,40)+'…':text);
    load();
  }

  document.getElementById('btn-send').onclick = ()=>{
    const text = input.value.trim();
    if(!text) return;
    input.value='';
    sendText(text);
  };
  input.addEventListener('keydown', e=>{
    if(e.key==='Enter' && !e.shiftKey){ e.preventDefault(); document.getElementById('btn-send').click(); }
  });

  // Select mode
  document.getElementById('btn-select').onclick = ()=>{
    selectMode = !selectMode;
    selected.clear();
    document.getElementById('sel-bar').classList.toggle('hidden', !selectMode);
    document.getElementById('sel-count').textContent = '0 seleccionados';
    render();
  };
  document.getElementById('btn-del-sel').onclick = async ()=>{
    if(!selected.size) return;
    if(!confirm('¿Borrar '+selected.size+' mensaje(s)?')) return;
    for(const id of selected){
      await window.KeepsakeDB.deleteContenido(id);
    }
    selected.clear();
    selectMode=false;
    document.getElementById('sel-bar').classList.add('hidden');
    load();
  };

  // Stickers
  const stickBox = document.getElementById('stickers');
  stickBox.innerHTML = EMOJIS.map(e=>`<button type="button" class="stk p-1">${e}</button>`).join('');
  stickBox.querySelectorAll('.stk').forEach(b=>{
    b.onclick = ()=>{ sendText(b.textContent, {titulo:'sticker'}); stickBox.classList.add('hidden'); };
  });
  document.getElementById('btn-sticker').onclick = ()=>{
    document.getElementById('walls').classList.add('hidden');
    stickBox.classList.toggle('hidden');
  };

  // Wallpaper shared
  const wallList = document.getElementById('wall-list');
  wallList.innerHTML = WALLS.map(w=>`<button type="button" data-css="${w.css.replace(/"/g,'')}" class="w-12 h-12 rounded-xl shrink-0 border border-[#e5e2dd]" style="background:${w.css}"></button>`).join('');
  wallList.querySelectorAll('button').forEach(b=>{
    b.onclick = async ()=>{
      await saveWall(b.dataset.css);
      document.getElementById('walls').classList.add('hidden');
    };
  });
  document.getElementById('btn-wall').onclick = ()=>{
    stickBox.classList.add('hidden');
    document.getElementById('walls').classList.toggle('hidden');
  };

  document.getElementById('btn-title').onclick = ()=>{
    const next = prompt('¿Cómo quieres ver a la otra persona aquí?', currentTitle());
    if(next===null) return;
    const name = next.trim() || otherDefault;
    localStorage.setItem(TITLE_KEY, name);
    setTitleUI();
  };

  async function saveWall(value){
    applyWall(value);
    const all = await window.KeepsakeDB.fetchContenidoAny(['textos']);
    const existing = (all||[]).find(i => (i.comentario||'')==='chat_bg');
    if(existing) await window.KeepsakeDB.updateContenido(existing.id, {mensaje: value});
    else await window.KeepsakeDB.insertContenido({seccion:'textos', tipo:'texto', titulo:'fondo', mensaje:value, comentario:'chat_bg'});
  }

  document.getElementById('wall-file').onchange = async function(){
    const file = this.files && this.files[0];
    if(!file) return;
    const local = URL.createObjectURL(file);
    await applyWall(local);
    const {url, error} = await window.KeepsakeDB.uploadFile(file, 'chat-bg', {plain:true});
    this.value='';
    if(error||!url){
      alert('No se pudo subir el fondo: '+(window.KeepsakeDB.errMsg(error)||'sin URL. Revisa Storage.'));
      return;
    }
    await saveWall(url);
    document.getElementById('walls').classList.add('hidden');
  };

  // Recording WhatsApp-style
  function fmtSec(s){ return Math.floor(s/60)+':'+String(s%60).padStart(2,'0'); }
  function startTimer(){
    recTimer = setInterval(()=>{ recSec++; document.getElementById('rec-time').textContent=fmtSec(recSec); }, 1000);
  }
  function stopTimer(){ if(recTimer){ clearInterval(recTimer); recTimer=null; } }

  function stopTracks(){
    if(recStream){ recStream.getTracks().forEach(t=>t.stop()); recStream=null; }
  }

  async function startRec(){
    try{
      recStream = await navigator.mediaDevices.getUserMedia({audio:true});
      chunks=[]; recSec=0; paused=false; recording=true;
      const mime = MediaRecorder.isTypeSupported('audio/webm;codecs=opus') ? 'audio/webm;codecs=opus'
        : (MediaRecorder.isTypeSupported('audio/mp4') ? 'audio/mp4'
        : (MediaRecorder.isTypeSupported('audio/webm') ? 'audio/webm' : ''));
      mediaRec = mime ? new MediaRecorder(recStream, {mimeType: mime}) : new MediaRecorder(recStream);
      mediaRec.ondataavailable = e=>{ if(e.data && e.data.size) chunks.push(e.data); };
      mediaRec.start(200);
      document.getElementById('composer').classList.add('hidden');
      document.getElementById('rec-bar').classList.remove('hidden');
      document.getElementById('rec-time').textContent='0:00';
      document.getElementById('rec-pause-icon').textContent='pause';
      document.getElementById('rec-dot').classList.add('pulse');
      startTimer();
    }catch(e){ alert('No se pudo usar el micrófono: '+e.message); }
  }

  function discardRec(){
    try{ if(mediaRec && mediaRec.state!=='inactive') mediaRec.stop(); }catch(e){}
    stopTimer(); stopTracks();
    recording=false; paused=false; chunks=[]; mediaRec=null;
    document.getElementById('rec-bar').classList.add('hidden');
    document.getElementById('composer').classList.remove('hidden');
  }

  function pauseRec(){
    if(!mediaRec) return;
    if(!paused && mediaRec.state==='recording'){
      mediaRec.pause(); paused=true; stopTimer();
      document.getElementById('rec-pause-icon').textContent='play_arrow';
      document.getElementById('rec-dot').classList.remove('pulse');
    } else if(paused && mediaRec.state==='paused'){
      mediaRec.resume(); paused=false; startTimer();
      document.getElementById('rec-pause-icon').textContent='pause';
      document.getElementById('rec-dot').classList.add('pulse');
    }
  }

  function sendRec(){
    if(!mediaRec) return;
    mediaRec.onstop = async ()=>{
      stopTracks(); stopTimer();
      const blobType = mediaRec.mimeType || 'audio/webm';
      const ext = blobType.includes('mp4') ? 'm4a' : 'webm';
      const blob = new Blob(chunks, {type: blobType});
      if(!blob.size){ discardRec(); return; }
      const file = new File([blob], 'nota.'+ext, {type: blobType});
      const {url,error:upErr} = await window.KeepsakeDB.uploadFile(file,'chat');
      recording=false;
      document.getElementById('rec-bar').classList.add('hidden');
      document.getElementById('composer').classList.remove('hidden');
      if(upErr||!url){ alert('Audio: '+window.KeepsakeDB.errMsg(upErr)); return; }
      const {error} = await window.KeepsakeDB.insertContenido({
        seccion:'textos', tipo:'audio', titulo:'audio', url_archivo:url, comentario:'chat'
      });
      if(error){ alert(window.KeepsakeDB.errMsg(error)); return; }
      await notifyOther('una nota de voz');
      load();
    };
    if(mediaRec.state!=='inactive') mediaRec.stop();
  }

  document.getElementById('btn-rec').onclick = startRec;
  document.getElementById('rec-del').onclick = discardRec;
  document.getElementById('rec-pause').onclick = pauseRec;
  document.getElementById('rec-send').onclick = sendRec;

  document.addEventListener('supabase-ready', load);
  setTimeout(load, 400);
  setInterval(load, 10000);
})();
</script>
</body>
</html>
