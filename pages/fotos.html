<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Instantáneas</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{colors:{primary:"#944652","primary-container":"#d67b88","on-primary":"#ffffff",surface:"#fcf9f4","on-surface":"#1c1c19","on-surface-variant":"#534344",tertiary:"#865046"},fontFamily:{display:["Playfair Display"],body:["Plus Jakarta Sans"]}}}};
</script>
<style>
html,body{margin:0;width:100%;overflow-x:hidden}body{overscroll-behavior:none;background:#fcf9f4;-webkit-tap-highlight-color:transparent}
.pb-safe{padding-bottom:env(safe-area-inset-bottom,0)}.filter-active{background:#d67b88;color:#fff}.view-active{background:#d67b88;color:#fff}
.item-card{cursor:pointer}.item-card:active{transform:scale(.98)}
.fx-none{filter:none}.fx-warm{filter:sepia(.25) saturate(1.2) brightness(1.05)}
.fx-bw{filter:grayscale(1)}.fx-soft{filter:contrast(.9) brightness(1.08) saturate(.85)}
.fx-rose{filter:sepia(.15) hue-rotate(-15deg) saturate(1.3)}
.fx-btn.active{ring:2px;outline:2px solid #d67b88}
</style>
</head>
<body class="font-body text-on-surface min-h-screen flex flex-col">
<main class="flex-1 px-4 pt-3 pb-28 max-w-lg mx-auto w-full">
  <div class="flex items-center justify-end mb-2">
    <button id="btn-camera" type="button" class="inline-flex items-center gap-1 px-4 py-2 rounded-full bg-[#e8a598] text-white text-sm font-semibold shadow active:scale-95">
      <span class="material-symbols-outlined text-[18px]">photo_camera</span> Tomar foto
    </button>
  </div>
  <div class="flex flex-col items-center text-center mb-2">
    <h1 class="font-display text-2xl italic font-semibold">Instantáneas</h1>
    <p class="text-xs text-on-surface-variant italic">El día a día. Toca una para editar o guardar.</p>
  </div>
  <div class="flex items-center justify-between mb-2">
    <span id="counter-text" class="text-sm text-on-surface-variant px-3 py-1.5 rounded-full bg-[#ebe8e3]">0 instantáneas</span>
    <div class="inline-flex p-1 bg-[#e5e2dd] rounded-full">
      <button id="view-grid" type="button" class="px-2.5 py-1 rounded-full text-xs view-active">Cuadrícula</button>
      <button id="view-list" type="button" class="px-2.5 py-1 rounded-full text-xs text-on-surface-variant">Lista</button>
    </div>
  </div>
  <div class="flex items-center gap-2 overflow-x-auto pb-2 mb-4">
    <button type="button" data-filter="todos" class="filter-btn filter-active shrink-0 px-3 py-1.5 rounded-full text-xs font-medium">Todos</button>
    <button type="button" data-filter="Alessandro" class="filter-btn shrink-0 px-3 py-1.5 rounded-full bg-white shadow-sm text-xs">Alessandro</button>
    <button type="button" data-filter="Mayerli" class="filter-btn shrink-0 px-3 py-1.5 rounded-full bg-white shadow-sm text-xs">Mayerli</button>
  </div>
  <div id="list" class="space-y-3"></div>
  <div id="empty" class="hidden flex flex-col items-center text-center py-14">
    <span class="material-symbols-outlined text-5xl text-[#c4867a]/40 mb-3">photo_camera</span>
    <p class="font-display text-xl italic text-on-surface-variant">Sin instantáneas aún</p>
  </div>
</main>

<!-- Capture / filter modal -->
<div id="modal-cap" class="hidden fixed inset-0 z-[100] bg-black/50 flex items-end sm:items-center justify-center p-4">
  <div class="bg-white rounded-3xl w-full max-w-md p-5 shadow-xl max-h-[92vh] overflow-y-auto">
    <h3 class="font-display text-2xl italic mb-3">Nueva instantánea</h3>
    <input id="cap-file" type="file" accept="image/*" capture="environment" class="hidden"/>
    <button id="btn-pick-cam" type="button" class="w-full py-3 rounded-2xl bg-[#e8a598] text-white font-semibold mb-2 flex items-center justify-center gap-2">
      <span class="material-symbols-outlined">photo_camera</span> Abrir cámara
    </button>
    <button id="btn-pick-gal" type="button" class="w-full py-2.5 rounded-2xl bg-[#f0ede9] text-sm mb-4 flex items-center justify-center gap-2">
      <span class="material-symbols-outlined text-[18px]">image</span> Elegir de galería
    </button>
    <div id="cap-preview-wrap" class="hidden mb-3">
      <div class="rounded-xl overflow-hidden aspect-[4/3] bg-[#1c1c19] flex items-center justify-center">
        <img id="cap-preview" class="max-w-full max-h-full object-contain fx-none" alt=""/>
      </div>
      <p class="text-xs text-on-surface-variant mt-2 mb-1">Filtro</p>
      <div class="flex gap-2 overflow-x-auto pb-1">
        <button type="button" data-fx="none" class="fx-btn active shrink-0 px-3 py-1.5 rounded-full bg-[#f0ede9] text-xs">Original</button>
        <button type="button" data-fx="warm" class="fx-btn shrink-0 px-3 py-1.5 rounded-full bg-[#f0ede9] text-xs">Cálido</button>
        <button type="button" data-fx="rose" class="fx-btn shrink-0 px-3 py-1.5 rounded-full bg-[#f0ede9] text-xs">Rosa</button>
        <button type="button" data-fx="soft" class="fx-btn shrink-0 px-3 py-1.5 rounded-full bg-[#f0ede9] text-xs">Suave</button>
        <button type="button" data-fx="bw" class="fx-btn shrink-0 px-3 py-1.5 rounded-full bg-[#f0ede9] text-xs">B/N</button>
      </div>
    </div>
    <label class="block text-sm mb-1">Nota (opcional)</label>
    <input id="cap-titulo" class="w-full px-3 py-2 rounded-xl bg-[#f6f3ee] mb-3 outline-none text-sm" placeholder="Qué estás viviendo..."/>
    <p id="cap-status" class="text-xs text-red-600 mb-2 hidden"></p>
    <div class="flex gap-2">
      <button id="cap-cancel" type="button" class="flex-1 py-2.5 rounded-full bg-[#f0ede9] text-sm">Cancelar</button>
      <button id="cap-save" type="button" class="flex-1 py-2.5 rounded-full bg-[#e8a598] text-white text-sm font-semibold">Publicar</button>
    </div>
  </div>
</div>

<!-- Detail modal -->
<div id="modal-detail" class="hidden fixed inset-0 z-[100] bg-black/50 flex items-end sm:items-center justify-center p-0 sm:p-4">
  <div class="bg-white rounded-t-3xl sm:rounded-3xl w-full max-w-md max-h-[92vh] overflow-y-auto shadow-xl">
    <div class="relative bg-[#1c1c19]">
      <img id="det-img" class="w-full max-h-[50vh] object-contain mx-auto" alt=""/>
      <button id="det-close" type="button" class="absolute top-3 right-3 w-9 h-9 rounded-full bg-black/40 text-white flex items-center justify-center"><span class="material-symbols-outlined">close</span></button>
    </div>
    <div class="p-5">
      <input id="det-titulo" class="w-full font-display text-xl italic outline-none bg-transparent mb-2 border-b border-transparent focus:border-primary-container"/>
      <p id="det-meta" class="text-xs text-on-surface-variant mb-4"></p>
      <div class="grid grid-cols-3 gap-2">
        <button id="det-save" type="button" class="py-2.5 rounded-full bg-primary-container text-white text-xs font-semibold flex flex-col items-center gap-0.5"><span class="material-symbols-outlined text-[18px]">save</span> Editar</button>
        <a id="det-download" href="#" download class="py-2.5 rounded-full bg-[#f0ede9] text-xs font-semibold flex flex-col items-center gap-0.5"><span class="material-symbols-outlined text-[18px]">download</span> Descargar</a>
        <button id="det-delete" type="button" class="py-2.5 rounded-full bg-red-50 text-red-700 text-xs font-semibold flex flex-col items-center gap-0.5"><span class="material-symbols-outlined text-[18px]">delete</span> Eliminar</button>
      </div>
      <p id="det-status" class="text-xs text-center mt-3 hidden"></p>
    </div>
  </div>
</div>

<nav class="fixed bottom-0 inset-x-0 z-50 pb-safe px-1 pointer-events-none">
  <div class="pointer-events-auto mx-auto max-w-[520px] mb-2 bg-white/95 backdrop-blur-xl rounded-full shadow-lg px-0.5 py-0.5 flex items-center justify-around">
    <a class="flex flex-col items-center justify-center flex-1 min-w-0 py-1.5 text-on-surface-variant" href="inicio.html"><span class="material-symbols-outlined text-[18px]">favorite</span><span class="text-[8px] mt-0.5 truncate">Espacio</span></a><a class="flex flex-col items-center justify-center flex-1 min-w-0 py-1.5 text-on-surface-variant" href="recuerdos.html"><span class="material-symbols-outlined text-[18px]">auto_stories</span><span class="text-[8px] mt-0.5 truncate">Recuerdos</span></a><a class="flex flex-col items-center justify-center flex-1 min-w-0 py-1.5 text-primary scale-105 font-bold" href="fotos.html"><span class="material-symbols-outlined text-[18px]">photo_camera</span><span class="text-[8px] mt-0.5 truncate">Fotos</span></a><a class="flex flex-col items-center justify-center flex-1 min-w-0 py-1.5 text-on-surface-variant" href="musica.html"><span class="material-symbols-outlined text-[18px]">music_note</span><span class="text-[8px] mt-0.5 truncate">Música</span></a><a class="flex flex-col items-center justify-center flex-1 min-w-0 py-1.5 text-on-surface-variant" href="cartas.html"><span class="material-symbols-outlined text-[18px]">mail</span><span class="text-[8px] mt-0.5 truncate">Cartas</span></a><a class="relative flex flex-col items-center justify-center flex-1 min-w-0 py-1.5 text-on-surface-variant" href="avisos.html"><span class="material-symbols-outlined text-[18px]">notifications</span><span class="absolute top-0.5 right-0.5 min-w-[12px] h-[12px] rounded-full bg-primary-container text-white text-[7px] font-bold flex items-center justify-center unread-badge hidden">0</span><span class="text-[8px] mt-0.5 truncate">Avisos</span></a><a class="flex flex-col items-center justify-center flex-1 min-w-0 py-1.5 text-on-surface-variant" href="cambiar-usuario.html"><span class="material-symbols-outlined text-[18px]">switch_account</span><span class="text-[8px] mt-0.5 truncate">Yo</span></a>
  </div>
</nav>

<script src="../js/supabase-client.js"></script>
<script>
(function(){
  if(!localStorage.getItem('keepsake_user')){ location.replace('../index.html'); return; }
  let items=[], filter='todos', view='list', selectedFile=null, currentFx='none', current=null;
  const listEl=document.getElementById('list'), emptyEl=document.getElementById('empty');
  const preview=document.getElementById('cap-preview');

  function esc(s){if(!s)return'';return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;');}

  function render(){
    let data=filter==='todos'?items:items.filter(i=>(i.autor||'').toLowerCase()===filter.toLowerCase());
    document.getElementById('counter-text').textContent=data.length+(data.length===1?' instantánea':' instantáneas');
    if(!data.length){listEl.innerHTML='';emptyEl.classList.remove('hidden');emptyEl.classList.add('flex');return;}
    emptyEl.classList.add('hidden');emptyEl.classList.remove('flex');
    if(view==='grid'){
      listEl.className='grid grid-cols-2 gap-3';
      listEl.innerHTML=data.map(item=>`<div class="item-card bg-white rounded-2xl overflow-hidden shadow-sm" data-id="${item.id}">
        <div class="aspect-square bg-[#f0ede9]">${item.url_archivo?`<img src="${item.url_archivo}" class="w-full h-full object-cover" loading="lazy"/>`:'📷'}</div>
        <div class="p-2"><p class="text-[10px] text-on-surface-variant">${esc(item.autor)||''} · ${window.KeepsakeDB.formatFullDate(item.created_at)}</p></div></div>`).join('');
    } else {
      listEl.className='space-y-3';
      listEl.innerHTML=data.map(item=>`<div class="item-card flex gap-3 bg-white rounded-2xl p-3 shadow-sm" data-id="${item.id}">
        <div class="w-20 h-20 rounded-xl overflow-hidden bg-[#f0ede9] shrink-0">${item.url_archivo?`<img src="${item.url_archivo}" class="w-full h-full object-cover" loading="lazy"/>`:'📷'}</div>
        <div class="flex-1"><p class="text-sm">${esc(item.titulo)||'Instantánea'}</p>
        <p class="text-xs text-on-surface-variant mt-1">${esc(item.autor)||''} · ${window.KeepsakeDB.formatFullDate(item.created_at)}</p></div></div>`).join('');
    }
    listEl.querySelectorAll('.item-card').forEach(el=>el.addEventListener('click',()=>openDetail(el.dataset.id)));
    if(window.KeepsakeDB.hydrateMedia) window.KeepsakeDB.hydrateMedia(listEl);
  }

  function openDetail(id){
    current=items.find(i=>i.id===id); if(!current) return;
    const img=document.getElementById('det-img');
    img.src=current.url_archivo||'';
    if(window.KeepsakeDB.resolveMedia && /\.e2ee/i.test(current.url_archivo||'')){
      window.KeepsakeDB.resolveMedia(current.url_archivo).then(u=>{ if(u) img.src=u; });
    }
    document.getElementById('det-titulo').value=current.titulo||'';
    document.getElementById('det-meta').textContent=(current.autor||'')+' · '+window.KeepsakeDB.formatFullDate(current.created_at);
    const dl=document.getElementById('det-download');
    if(current.url_archivo){dl.href=current.url_archivo;dl.classList.remove('opacity-40','pointer-events-none');}
    else{dl.removeAttribute('href');dl.classList.add('opacity-40','pointer-events-none');}
    document.getElementById('det-status').classList.add('hidden');
    document.getElementById('modal-detail').classList.remove('hidden');
  }
  document.getElementById('det-close').onclick=()=>document.getElementById('modal-detail').classList.add('hidden');
  document.getElementById('det-save').onclick=async()=>{
    if(!current) return;
    const titulo=document.getElementById('det-titulo').value.trim();
    const {error}=await window.KeepsakeDB.updateContenido(current.id,{titulo});
    const st=document.getElementById('det-status');
    if(error){st.textContent=window.KeepsakeDB.errMsg(error);st.classList.remove('hidden');return;}
    st.textContent='Guardado';st.classList.remove('hidden');load();
  };
  document.getElementById('det-delete').onclick=async()=>{
    if(!current||!confirm('¿Borrar esta instantánea?')) return;
    const {error}=await window.KeepsakeDB.deleteContenido(current.id);
    if(error){alert(window.KeepsakeDB.errMsg(error));return;}
    document.getElementById('modal-detail').classList.add('hidden');load();
  };

  async function load(){ items=await window.KeepsakeDB.fetchContenidoAny(['fotos','instantaneas','instantáneas']); render(); }

  document.querySelectorAll('.filter-btn').forEach(btn=>btn.addEventListener('click',()=>{
    filter=btn.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b=>{b.classList.remove('filter-active');b.classList.add('bg-white','shadow-sm');});
    btn.classList.add('filter-active');btn.classList.remove('bg-white','shadow-sm');render();
  }));
  document.getElementById('view-grid').onclick=function(){view='grid';this.classList.add('view-active');document.getElementById('view-list').classList.remove('view-active');render();};
  document.getElementById('view-list').onclick=function(){view='list';this.classList.add('view-active');document.getElementById('view-grid').classList.remove('view-active');render();};

  // Capture flow
  const modalCap=document.getElementById('modal-cap');
  const fileInput=document.getElementById('cap-file');
  document.getElementById('btn-camera').onclick=()=>{
    modalCap.classList.remove('hidden');
    selectedFile=null; currentFx='none';
    document.getElementById('cap-preview-wrap').classList.add('hidden');
    document.getElementById('cap-status').classList.add('hidden');
    document.getElementById('cap-titulo').value='';
    // try open camera immediately
    fileInput.setAttribute('capture','environment');
    setTimeout(()=>fileInput.click(), 200);
  };
  document.getElementById('btn-pick-cam').onclick=()=>{
    fileInput.setAttribute('capture','environment');
    fileInput.click();
  };
  document.getElementById('btn-pick-gal').onclick=()=>{
    fileInput.removeAttribute('capture');
    fileInput.click();
  };
  document.getElementById('cap-cancel').onclick=()=>modalCap.classList.add('hidden');
  fileInput.onchange=function(){
    selectedFile=this.files&&this.files[0];
    if(!selectedFile) return;
    preview.src=URL.createObjectURL(selectedFile);
    preview.className='max-w-full max-h-full object-contain fx-'+currentFx;
    document.getElementById('cap-preview-wrap').classList.remove('hidden');
  };
  document.querySelectorAll('.fx-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      currentFx=btn.dataset.fx;
      document.querySelectorAll('.fx-btn').forEach(b=>b.classList.remove('active','ring-2','ring-primary-container'));
      btn.classList.add('active');
      preview.className='max-w-full max-h-full object-contain fx-'+currentFx;
    });
  });

  /** Apply CSS filter to canvas and return Blob */
  function applyFilterToBlob(file, fx){
    return new Promise((resolve,reject)=>{
      const img=new Image();
      img.onload=()=>{
        const c=document.createElement('canvas');
        c.width=img.naturalWidth; c.height=img.naturalHeight;
        const ctx=c.getContext('2d');
        const filters={
          none:'none',
          warm:'sepia(0.25) saturate(1.2) brightness(1.05)',
          bw:'grayscale(1)',
          soft:'contrast(0.9) brightness(1.08) saturate(0.85)',
          rose:'sepia(0.15) hue-rotate(-15deg) saturate(1.3)'
        };
        ctx.filter=filters[fx]||'none';
        ctx.drawImage(img,0,0);
        c.toBlob(b=>b?resolve(b):reject(new Error('canvas')), 'image/jpeg', 0.9);
      };
      img.onerror=reject;
      img.src=URL.createObjectURL(file);
    });
  }

  document.getElementById('cap-save').onclick=async()=>{
    if(!selectedFile){document.getElementById('cap-status').textContent='Toma o elige una foto';document.getElementById('cap-status').classList.remove('hidden');return;}
    const btn=document.getElementById('cap-save');
    const st=document.getElementById('cap-status');
    btn.disabled=true;btn.textContent='Procesando…';st.classList.add('hidden');
    try{
      let fileToUp=selectedFile;
      if(currentFx!=='none'){
        const blob=await applyFilterToBlob(selectedFile, currentFx);
        fileToUp=new File([blob], 'instantanea.jpg', {type:'image/jpeg'});
      }
      btn.textContent='Subiendo…';
      const {url,error:upErr}=await window.KeepsakeDB.uploadFile(fileToUp,'fotos');
      if(upErr||!url){ st.textContent='Storage: '+window.KeepsakeDB.errMsg(upErr); st.classList.remove('hidden'); btn.disabled=false;btn.textContent='Publicar';return; }
      const titulo=document.getElementById('cap-titulo').value.trim();
      const {data,error}=await window.KeepsakeDB.insertContenido({seccion:'instantaneas',tipo:'imagen',titulo:titulo||'Instantánea',url_archivo:url});
      if(error){ st.textContent='BD: '+window.KeepsakeDB.errMsg(error); st.classList.remove('hidden'); btn.disabled=false;btn.textContent='Publicar';return; }
      if(data) await window.KeepsakeDB.createNotificacion({mensaje:window.KeepsakeDB.getCurrentUser()+' compartió una instantánea',contenido_id:data.id,seccion:'instantaneas',url_archivo:url});
      modalCap.classList.add('hidden');
      btn.disabled=false;btn.textContent='Publicar';
      load();
    }catch(e){
      st.textContent=String(e.message||e); st.classList.remove('hidden');
      btn.disabled=false;btn.textContent='Publicar';
    }
  };

  document.addEventListener('supabase-ready',load);
  setTimeout(load,400);
  setTimeout(()=>window.KeepsakeDB&&window.KeepsakeDB.refreshUnreadBadge(),600);
})();
</script>
</body>
</html>
