<script>
  let selectedUser = null;

  function selectProfile(user) {
    selectedUser = user;
    const cards = document.querySelectorAll('.profile-card');
    cards.forEach(c => {
      c.classList.remove('bg-primary-fixed/20', 'bg-secondary-fixed/20');
      c.classList.add('bg-surface-container-lowest');
      const check = c.querySelector('.check-icon');
      if (check) {
        check.classList.add('opacity-0', 'scale-50');
        check.classList.remove('opacity-100', 'scale-100');
      }
    });

    const activeCard = document.getElementById(`btn-${user}`);
    if (activeCard) {
      if (user === 'alessandro') {
        activeCard.classList.remove('bg-surface-container-lowest');
        activeCard.classList.add('bg-secondary-fixed/30');
      } else {
        activeCard.classList.remove('bg-surface-container-lowest');
        activeCard.classList.add('bg-primary-fixed/40');
      }
      const check = activeCard.querySelector('.check-icon');
      if (check) {
        check.classList.remove('opacity-0', 'scale-50');
        check.classList.add('opacity-100', 'scale-100');
      }
    }

    const btnLabel = document.getElementById('button-label');
    if (btnLabel) {
      const name = user === 'alessandro' ? 'Alessandro' : 'Mayerli';
      btnLabel.textContent = `Entrar como ${name}`;
    }
  }

  function enterSpace() {
    const btn = document.getElementById('enter-button');
    btn.classList.add('scale-95');
    setTimeout(() => {
      btn.classList.remove('scale-95');
      const name = selectedUser ? (selectedUser === 'alessandro' ? 'Alessandro' : 'Mayerli') : 'dos';
      btn.innerHTML = `<span>¡Te amo!</span> <span class="material-symbols-outlined text-base">favorite</span>`;
    }, 150);
  }

  // Generate subtle drifting floral specks
  const container = document.getElementById('petal-container');
  if (container) {
    for (let i = 0; i < 9; i++) {
      const dot = document.createElement('div');
      dot.className = 'absolute rounded-full bg-primary-container/20';
      const size = Math.random() * 6 + 3;
      dot.style.width = `${size}px`;
      dot.style.height = `${size}px`;
      dot.style.top = `${Math.random() * 90}%`;
      dot.style.left = `${Math.random() * 90}%`;
      dot.style.opacity = (Math.random() * 0.4 + 0.2).toString();
      container.appendChild(dot);
    }
  }
</script></main>

<script>
(function(){
  async function refreshUnreadBadge() {
    try {
      if (!window.KeepsakeDB) return;
      const count = await window.KeepsakeDB.getUnreadCount();
      document.querySelectorAll('.unread-badge').forEach(badge => {
        if (count > 0) {
          badge.textContent = count > 9 ? '9+' : count;
          badge.classList.remove('hidden');
        } else {
          badge.classList.add('hidden');
        }
      });
    } catch(e) {}
  }
  document.addEventListener('supabase-ready', refreshUnreadBadge);
  setTimeout(refreshUnreadBadge, 900);
})();
</script>
