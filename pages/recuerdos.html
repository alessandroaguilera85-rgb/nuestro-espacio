<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" name="viewport"/>
<title>Recuerdos</title>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400..700;1,400..700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>
tailwind.config={theme:{extend:{colors:{"primary-fixed":"#ffd9dd","primary-container":"#d67b88",primary:"#944652","on-primary":"#ffffff",surface:"#fcf9f4","on-surface":"#1c1c19","on-surface-variant":"#534344",tertiary:"#865046"},fontFamily:{display:["Playfair Display"],body:["Plus Jakarta Sans"]}}}};
</script>
<style>
html,body{margin:0;width:100%;overflow-x:hidden}body{overscroll-behavior:none;background:#fcf9f4;-webkit-tap-highlight-color:transparent}
.pb-safe{padding-bottom:env(safe-area-inset-bottom,0)}.filter-active{background:#d67b88;color:#fff}.media-active{background:#d67b88;color:#fff;border-color:transparent!important}.view-active{background:#d67b88;color:#fff}
.item-card{cursor:pointer;transition:transform .15s}.item-card:active{transform:scale(.98)}
</style>
</head>
<body class="font-body text-on-surface min-h-screen flex flex-col">
<main class="flex-1 px-4 pt-3 pb-28 max-w-lg mx-auto w-full">
  <div class="flex items-center justify-end mb-2">
    <button id="btn-upload" type="button" class="inline-flex items-center gap-1 px-4 py-2 rounded-full bg-primary-container text-on-primary text-sm font-semibold shadow active:scale-95">
      <span class="material-symbols-outlined text-[18px]">add</span> Subir
    </button>
  </div>
  <div class="flex flex-col items-center text-center mb-2">
    <h1 class="font-display text-2xl italic font-semibold">Recuerdos</h1>
    <p class="text-xs text-on-surface-variant italic">Cada foto es un pedacito de nuestra historia.</p>
  </div>
  <div class="flex items-center justify-between mb-2 gap-2">
    <span class="inline-flex items-center gap-1 px-2.5 py-1 rounded-full bg-[#ebe8e3] text-xs text-on-surface-variant shrink-0">
      <span id="counter-text">0 recuerdos</span>
    </span>
    <div class="inline-flex p-1 bg-[#e5e2dd] rounded-full shrink-0">
      <button id="view-grid" type="button" class="px-2.5 py-1 rounded-full text-xs view-active">Cuadrícula</button>
      <button id="view-list" type="button" class="px-2.5 py-1 rounded-full text-xs text-on-surface-variant">Lista</button>
    </div>
  </div>
  <div class="flex items-center gap-2 overflow-x-auto pb-2 mb-1.5">
    <button type="button" data-filter="todos" class="filter-btn filter-active shrink-0 px-3 py-1.5 rounded-full text-xs font-medium">Todos</button>
    <button type="button" data-filter="Alessandro" class="filter-btn shrink-0 px-3 py-1.5 rounded-full bg-white shadow-sm text-xs">Alessandro</button>
    <button type="button" data-filter="Mayerli" class="filter-btn shrink-0 px-3 py-1.5 rounded-full bg-white shadow-sm text-xs">Mayerli</button>
  </div>
  <div class="flex items-center gap-2 overflow-x-auto pb-1 mb-3">
    <button type="button" data-media="ambos" class="media-btn media-active shrink-0 px-3 py-1.5 rounded-full text-xs font-medium shadow-sm">Ambos</button>
    <button type="button" data-media="foto" class="media-btn shrink-0 px-3 py-1.5 rounded-full text-xs bg-white shadow-sm">Fotos</button>
    <button type="button" data-media="video" class="media-btn shrink-0 px-3 py-1.5 rounded-full text-xs bg-white shadow-sm">Videos</button>
  </div>
  <div id="list" class="space-y-3"></div>
  <div id="empty" class="hidden flex flex-col items-center text-center py-14">
    <span class="material-symbols-outlined text-5xl text-primary-container/40 mb-3">photo_library</span>
    <p class="font-display text-xl italic text-on-surface-variant">Aún no hay recuerdos</p>
  </div>
</main>

<!-- Upload modal -->
<div id="modal-up" class="hidden fixed inset-0 z-[100] bg-black/40 flex items-end sm:items-center justify-center p-4">
  <div class="bg-white rounded-3xl w-full max-w-md p-5 shadow-xl max-h-[90vh] overflow-y-auto">
    <h3 class="font-display text-2xl italic mb-4">Subir recuerdo</h3>
    <label class="block text-sm mb-1">Foto o video</label>
    <input id="up-file" type="file" accept="image/*,video/*,.mp4,.mov,.webm" class="w-full text-sm mb-3"/>
    <div id="preview" class="hidden mb-3 rounded-xl overflow-hidden aspect-video bg-[#f0ede9]">
      <img id="preview-img" class="w-full h-full object-cover hidden"/>
      <video id="preview-vid" class="w-full h-full object-cover hidden" muted playsinline controls></video>
    </div>
    <label class="block text-sm mb-1">Título</label>
    <input id="up-titulo" class="w-full px-3 py-2 rounded-xl bg-[#f6f3ee] mb-3 outline-none text-sm" placeholder="Ej: Flores para ti"/>
    <label class="block text-sm mb-1">Mensaje (opcional)</label>
    <textarea id="up-mensaje" class="w-full px-3 py-2 rounded-xl bg-[#f6f3ee] mb-4 outline-none resize-none text-sm" rows="2"></textarea>
    <p id="up-status" class="text-xs text-red-600 mb-2 hidden"></p>
    <div class="flex gap-2">
      <button id="up-cancel" type="button" class="flex-1 py-2.5 rounded-full bg-[#f0ede9] text-sm">Cancelar</button>
      <button id="up-save" type="button" class="flex-1 py-2.5 rounded-full bg-primary-container text-white text-sm font-semibold">Guardar</button>
    </div>
  </div>
</div>

<!-- Detail modal -->
<div id="modal-detail" class="hidden fixed inset-0 z-[100] bg-black/50 flex items-end sm:items-center justify-center p-0 sm:p-4">
  <div class="bg-white rounded-t-3xl sm:rounded-3xl w-full max-w-md max-h-[92vh] overflow-y-auto shadow-xl">
    <div class="relative bg-[#1c1c19]">
      <img id="det-img" class="w-full max-h-[50vh] object-contain mx-auto" alt=""/>
      <video id="det-vid" class="w-full max-h-[50vh] object-contain mx-auto hidden" controls playsinline webkit-playsinline preload="metadata"></video>
      <button id="det-close" type="button" class="absolute top-3 right-3 w-9 h-9 rounded-full bg-black/40 text-white flex items-center justify-center">
        <span class="material-symbols-outlined">close</span>
      </button>
    </div>
    <div class="p-5">
      <input id="det-titulo" class="w-full font-display text-xl italic outline-none border-b border-transparent focus:border-primary-container bg-transparent mb-2"/>
      <textarea id="det-mensaje" class="w-full text-sm text-on-surface-variant outline-none resize-none bg-transparent mb-2" rows="3" placeholder="Mensaje..."></textarea>
      <p id="det-meta" class="text-xs text-on-surface-variant mb-4"></p>
      <div class="grid grid-cols-3 gap-2">
        <button id="det-save" type="button" class="py-2.5 rounded-full bg-primary-container text-white text-xs font-semibold flex flex-col items-center gap-0.5">
          <span class="material-symbols-outlined text-[18px]">edit</span> Editar
        </button>
        <a id="det-download" href="#" download class="py-2.5 rounded-full bg-[#f0ede9] text-xs font-semibold flex flex-col items-center gap-0.5 text-on-surface">
          <span class="material-symbols-outlined text-[18px]">download</span> Descargar
        </a>
        <button id="det-delete" type="button" class="py-2.5 rounded-full bg-red-50 text-red-700 text-xs font-semibold flex flex-col items-center gap-0.5">
          <span class="material-symbols-outlined text-[18px]">delete</span> Eliminar
        </button>
      </div>
      <p id="det-status" class="text-xs text-center mt-3 hidden"></p>
    </div>
  </div>
</div>

<nav class="fixed bottom-0 inset-x-0 z-50 pb-safe px-1 pointer-events-none">
  <div class="pointer-events-auto mx-auto max-w-[520px] mb-2 bg-white/95 backdrop-blur-xl rounded-full shadow-lg px-0.5 py-0.5 flex items-center justify-around">
    <a class="flex flex-col items-center justify-center flex-1 min-w-0 py-1.5 text-on-surface-variant" href="inicio.html"><span class="material-symbols-outlined text-[18px]">favorite</span><span class="text-[8px] mt-0.5 truncate">Espacio</span></a><a class="flex flex-col items-center justify-center flex-1 min-w-0 py-1.5 text-primary scale-105 font-bold" href="recuerdos.html"><span class="material-symbols-outlined text-[18px]">auto_stories</span><span class="text-[8px] mt-0.5 truncate">Recuerdos</span></a><a class="flex flex-col items-center justify-center flex-1 min-w-0 py-1.5 text-on-surface-variant" href="fotos.html"><span class="material-symbols-outlined text-[18px]">photo_camera</span><span class="text-[8px] mt-0.5 truncate">Fotos</span></a><a class="flex flex-col items-center justify-center flex-1 min-w-0 py-1.5 text-on-surface-variant" href="musica.html"><span class="material-symbols-outlined text-[18px]">music_note</span><span class="text-[8px] mt-0.5 truncate">Música</span></a><a class="flex flex-col items-center justify-center flex-1 min-w-0 py-1.5 text-on-surface-variant" href="cartas.html"><span class="material-symbols-outlined text-[18px]">mail</span><span class="text-[8px] mt-0.5 truncate">Cartas</span></a><a class="relative flex flex-col items-center justify-center flex-1 min-w-0 py-1.5 text-on-surface-variant" href="avisos.html"><span class="material-symbols-outlined text-[18px]">notifications</span><span class="absolute top-0.5 right-0.5 min-w-[12px] h-[12px] rounded-full bg-primary-container text-white text-[7px] font-bold flex items-center justify-center unread-badge hidden">0</span><span class="text-[8px] mt-0.5 truncate">Avisos</span></a><a class="flex flex-col items-center justify-center flex-1 min-w-0 py-1.5 text-on-surface-variant" href="cambiar-usuario.html"><span class="material-symbols-outlined text-[18px]">switch_account</span><span class="text-[8px] mt-0.5 truncate">Yo</span></a>
  </div>
</nav>

<script src="../js/supabase-client.js"></script>
<script>
(function(){
  if(!localStorage.getItem('keepsake_user')){ location.replace('../index.html'); return; }
  let items=[], filter='todos', mediaFilter='ambos', view='list', selectedFile=null, current=null;
  const listEl=document.getElementById('list'), emptyEl=document.getElementById('empty');

  function isVideo(item){
    const t=(item.tipo||'').toLowerCase();
    if(t==='video') return true;
    const u=(item.url_archivo||'').toLowerCase();
    return /\.(mp4|mov|webm|m4v)(\?|$)/.test(u);
  }
  function render(){
    let data=filter==='todos'?items:items.filter(i=>(i.autor||'').toLowerCase()===filter.toLowerCase());
    if(mediaFilter==='foto') data=data.filter(i=>!isVideo(i));
    if(mediaFilter==='video') data=data.filter(i=>isVideo(i));
    document.getElementById('counter-text').textContent=data.length+(data.length===1?' recuerdo':' recuerdos');
    if(!data.length){listEl.innerHTML='';emptyEl.classList.remove('hidden');emptyEl.classList.add('flex');return;}
    emptyEl.classList.add('hidden');emptyEl.classList.remove('flex');
    if(view==='grid'){
      listEl.className='grid grid-cols-2 gap-3';
      listEl.innerHTML=data.map(item=>{
        const vid=isVideo(item);
        const media=item.url_archivo
          ?(vid?`<video src="${item.url_archivo}" class="w-full h-full object-cover" muted playsinline></video><span class="absolute bottom-1 right-1 material-symbols-outlined text-white text-[18px] drop-shadow">play_circle</span>`
               :`<img src="${item.url_archivo}" class="w-full h-full object-cover" loading="lazy"/>`)
          :'📷';
        return `<div class="item-card bg-white rounded-2xl overflow-hidden shadow-sm" data-id="${item.id}">
        <div class="aspect-square bg-[#f0ede9] relative">${media}</div>
        <div class="p-2"><p class="text-sm font-medium truncate">${esc(item.titulo)||'Sin título'}</p>
        <p class="text-[10px] text-on-surface-variant">${esc(item.autor)||''}${vid?' · video':''}</p></div></div>`;
      }).join('');
    } else {
      listEl.className='space-y-3';
      listEl.innerHTML=data.map(item=>{
        const vid=isVideo(item);
        const thumb=item.url_archivo
          ?(vid?`<video src="${item.url_archivo}" class="w-full h-full object-cover" muted playsinline></video>`
               :`<img src="${item.url_archivo}" class="w-full h-full object-cover" loading="lazy"/>`)
          :'📷';
        return `<div class="item-card flex gap-3 bg-white rounded-2xl p-3 shadow-sm" data-id="${item.id}">
        <div class="w-20 h-20 rounded-xl overflow-hidden bg-[#f0ede9] shrink-0 relative">${thumb}${vid?'<span class="absolute bottom-0.5 right-0.5 material-symbols-outlined text-white text-[16px]">play_circle</span>':''}</div>
        <div class="flex-1 min-w-0"><p class="font-medium truncate">${esc(item.titulo)||'Sin título'}</p>
        ${item.mensaje?`<p class="text-sm text-on-surface-variant line-clamp-2">${esc(item.mensaje)}</p>`:''}
        <p class="text-xs text-on-surface-variant mt-1">${esc(item.autor)||''} · ${vid?'video · ':''}${window.KeepsakeDB.formatFullDate(item.created_at)}</p></div></div>`;
      }).join('');
    }
    listEl.querySelectorAll('.item-card').forEach(el=>{
      el.addEventListener('click',()=>openDetail(el.dataset.id));
    });
    if(window.KeepsakeDB && window.KeepsakeDB.resolveMedia){
      listEl.querySelectorAll('img[src], video[src]').forEach(async (el)=>{
        const u=el.getAttribute('src');
        if(u && /\.e2ee/i.test(u)) el.src = await window.KeepsakeDB.resolveMedia(u);
      });
    }
  }

  function esc(s){ if(!s) return ''; return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/"/g,'&quot;'); }

  function openDetail(id){
    current=items.find(i=>i.id===id);
    if(!current) return;
    const vid=isVideo(current);
    const img=document.getElementById('det-img');
    const vEl=document.getElementById('det-vid');
    const raw=current.url_archivo||'';
    const apply=async(el,isVid)=>{
      let src=raw;
      if(/\.e2ee/i.test(raw) && window.KeepsakeDB.resolveMedia) src=await window.KeepsakeDB.resolveMedia(raw);
      el.src=src||'';
    };
    if(vid){
      img.classList.add('hidden'); img.removeAttribute('src');
      vEl.classList.remove('hidden');
      apply(vEl,true);
    } else {
      vEl.classList.add('hidden'); vEl.removeAttribute('src');
      img.classList.remove('hidden');
      apply(img,false);
    }
    document.getElementById('det-titulo').value=current.titulo||'';
    document.getElementById('det-mensaje').value=current.mensaje||'';
    document.getElementById('det-meta').textContent=(current.autor||'')+(vid?' · video':'')+' · '+window.KeepsakeDB.formatFullDate(current.created_at);
    const dl=document.getElementById('det-download');
    if(current.url_archivo){ dl.href=current.url_archivo; dl.classList.remove('opacity-40','pointer-events-none'); }
    else { dl.removeAttribute('href'); dl.classList.add('opacity-40','pointer-events-none'); }
    document.getElementById('det-status').classList.add('hidden');
    document.getElementById('modal-detail').classList.remove('hidden');
  }

  document.getElementById('det-close').onclick=()=>document.getElementById('modal-detail').classList.add('hidden');
  document.getElementById('det-save').onclick=async()=>{
    if(!current) return;
    const titulo=document.getElementById('det-titulo').value.trim();
    const mensaje=document.getElementById('det-mensaje').value.trim();
    const st=document.getElementById('det-status');
    const {error}=await window.KeepsakeDB.updateContenido(current.id,{titulo,mensaje});
    if(error){ st.textContent='Error: '+window.KeepsakeDB.errMsg(error); st.classList.remove('hidden'); st.classList.add('text-red-600'); return; }
    st.textContent='Guardado'; st.classList.remove('hidden','text-red-600'); st.classList.add('text-green-700');
    load();
  };
  document.getElementById('det-delete').onclick=async()=>{
    if(!current||!confirm('¿Borrar este recuerdo?')) return;
    const {error}=await window.KeepsakeDB.deleteContenido(current.id);
    if(error){ alert('No se pudo borrar: '+window.KeepsakeDB.errMsg(error)); return; }
    document.getElementById('modal-detail').classList.add('hidden');
    load();
  };

  async function load(){
    items=await window.KeepsakeDB.fetchContenidoAny(['recuerdos','recuerdo']);
    render();
  }

  document.querySelectorAll('.filter-btn').forEach(btn=>btn.addEventListener('click',()=>{
    filter=btn.dataset.filter;
    document.querySelectorAll('.filter-btn').forEach(b=>{b.classList.remove('filter-active');b.classList.add('bg-white','shadow-sm');});
    btn.classList.add('filter-active');btn.classList.remove('bg-white','shadow-sm');render();
  }));
  document.querySelectorAll('.media-btn').forEach(btn=>btn.addEventListener('click',()=>{
    mediaFilter=btn.dataset.media;
    document.querySelectorAll('.media-btn').forEach(b=>{b.classList.remove('media-active');b.classList.add('bg-white');});
    btn.classList.add('media-active');
    render();
  }));
  document.getElementById('view-grid').onclick=function(){view='grid';this.classList.add('view-active');document.getElementById('view-list').classList.remove('view-active');render();};
  document.getElementById('view-list').onclick=function(){view='list';this.classList.add('view-active');document.getElementById('view-grid').classList.remove('view-active');render();};

  const modalUp=document.getElementById('modal-up'), statusEl=document.getElementById('up-status');
  document.getElementById('btn-upload').onclick=()=>{modalUp.classList.remove('hidden');selectedFile=null;document.getElementById('up-file').value='';document.getElementById('preview').classList.add('hidden');statusEl.classList.add('hidden');};
  document.getElementById('up-cancel').onclick=()=>modalUp.classList.add('hidden');
  document.getElementById('up-file').onchange=function(){
    selectedFile=this.files&&this.files[0];
    if(!selectedFile) return;
    const url=URL.createObjectURL(selectedFile);
    const isVid=selectedFile.type.startsWith('video/')||/\.(mp4|mov|webm|m4v)$/i.test(selectedFile.name||'');
    const img=document.getElementById('preview-img');
    const vid=document.getElementById('preview-vid');
    if(isVid){ img.classList.add('hidden'); vid.classList.remove('hidden'); vid.src=url; }
    else { vid.classList.add('hidden'); vid.removeAttribute('src'); img.classList.remove('hidden'); img.src=url; }
    document.getElementById('preview').classList.remove('hidden');
  };
  document.getElementById('up-save').onclick=async()=>{
    const titulo=document.getElementById('up-titulo').value.trim();
    const mensaje=document.getElementById('up-mensaje').value.trim();
    if(!titulo){statusEl.textContent='Pon un título';statusEl.classList.remove('hidden');return;}
    if(!selectedFile){statusEl.textContent='Elige una foto o un video';statusEl.classList.remove('hidden');return;}
    const btn=document.getElementById('up-save');
    btn.disabled=true;btn.textContent='Subiendo…';statusEl.classList.add('hidden');
    const {url,error:upErr}=await window.KeepsakeDB.uploadFile(selectedFile,'recuerdos');
    if(upErr||!url){
      statusEl.textContent='Storage: '+window.KeepsakeDB.errMsg(upErr);statusEl.classList.remove('hidden');
      btn.disabled=false;btn.textContent='Guardar';return;
    }
    const isVid = selectedFile.type.startsWith('video/') || /\.(mp4|mov|webm|m4v)$/i.test(selectedFile.name||'');
    const {data,error}=await window.KeepsakeDB.insertContenido({seccion:'recuerdos',tipo:isVid?'video':'imagen',titulo,mensaje:mensaje||undefined,url_archivo:url});
    if(error){
      statusEl.textContent='BD: '+window.KeepsakeDB.errMsg(error)+(error.code?' ['+error.code+']':'');
      statusEl.classList.remove('hidden');
      btn.disabled=false;btn.textContent='Guardar';return;
    }
    if(data) await window.KeepsakeDB.createNotificacion({mensaje:window.KeepsakeDB.getCurrentUser()+' subió un recuerdo: '+titulo,contenido_id:data.id,titulo,seccion:'recuerdos',url_archivo:url});
    modalUp.classList.add('hidden');document.getElementById('up-titulo').value='';document.getElementById('up-mensaje').value='';
    btn.disabled=false;btn.textContent='Guardar';load();
  };

  document.addEventListener('supabase-ready',load);
  setTimeout(load,400);
  setTimeout(()=>window.KeepsakeDB&&window.KeepsakeDB.refreshUnreadBadge(),600);
})();
</script>
</body>
</html>
